- name: Install the latest version of Apache
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Copy the terraform repo code
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: '0755'
    user: root
    group: root

- name: Install terraform service
  ansible.builtin.dnf:
    name: terraform
    state: present
    update_cache: yes